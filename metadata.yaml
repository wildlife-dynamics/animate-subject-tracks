name: Animate Subject Tracks
author:
  - name: Tevin Temu
    organization: Wildlife Dynamics
    email: tevin@wildlifedynamics.com

description: Turns an EarthRanger subject group's GPS history into an animated 3D map, with each subject's track sweeping across satellite imagery draped on real terrain over time. The same animation can optionally be exported as an MP4 video, with a camera designed in the map's Camera panel.
theory: "GPS relocations are converted to trajectory segments and cleaned by dropping segments whose length, duration, or speed fall outside realistic limits (such as GPS jumps). The cleaned trajectories are converted into time-stamped trips that animate from the first location to the last over a set playback duration. Tracks are placed on 3D terrain built from AWS Terrarium elevation tiles, using Google Maps 3D altitude modes (on the ground, a set height above it, recorded altitude, or above the terrain as drawn), with points added every 150 m so they follow the terrain between fixes, and an adjustable vertical exaggeration."
output_comment: "Outputs an interactive animated 3D map (animated_map.html) with playback controls, map buttons, a legend of subject names and a Camera panel; optionally an MP4 video of the animation (animation.mp4); GeoParquet files of the cleaned relocations and trajectories; and a dashboard showing the animated map, with a Files section for the map and video."
